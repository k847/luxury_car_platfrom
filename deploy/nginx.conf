# =============================================================
# 段功能：M5 Nginx 配置（D2 分离式部署，对齐 §13.2）
# 说明：前台 dist 静态托管 + /admin 后台静态 + /api 反代 FastAPI。
#       生产部署时把构建后的 dist 挂载到对应 root，反代指向后端容器。
# =============================================================

server {
  listen 80;
  server_name _;

  # 前端静态（Vite 构建产物，含前台与后台）
  # 前台：/         后台：/admin（同一 dist 或分开 dist，依构建方式）
  root /usr/share/nginx/html;
  index index.html;

  # 前台 SPA：非 API 请求回退 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API 反代到 FastAPI 后端
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 后台 SPA（若与前台同一 dist，上面 location / 已覆盖；此处保留演示分离目录）
  # location /admin {
  #   alias /usr/share/nginx/html/admin;
  #   try_files $uri $uri/ /admin/index.html;
  # }

  # 静态资源缓存
  location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # 安全头
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
